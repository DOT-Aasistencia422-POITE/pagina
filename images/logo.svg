<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Escudo Liceo La Paz" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="mitad-izq"><rect x="0" y="0" width="100" height="260"/></clipPath>
    <!-- Jarrón: labio ensanchado, cuello corto, cuerpo que se angosta hacia un pie pequeño -->
    <path id="jarron" d="M80 86 H120 L116 92 C124 97 127 104 127 113 C127 130 114 142 106 152 L112 162 H88 L94 152 C86 142 73 130 73 113 C73 104 76 97 84 92 Z"/>
  </defs>
  <!-- Escudo: lados rectos y punta inferior con curvas largas -->
  <path d="M12 12 H188 V168 C188 194 170 205 145 215 C122 224 106 233 100 248 C94 233 78 224 55 215 C30 205 12 194 12 168 Z"
        fill="#fff" stroke="#22962C" stroke-width="11" stroke-linejoin="round"/>
  <text x="100" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" fill="#111">LICEO</text>
  <!-- Círculo -->
  <circle cx="100" cy="122" r="58" fill="#BD0415"/>
  <circle cx="100" cy="122" r="45" fill="#22962C" stroke="#F3EAC8" stroke-width="2.5"/>
  <g transform="translate(100 127) scale(0.86) translate(-100 -124)">
  <!-- Asas -->
  <path d="M84 93 C71 85 62 94 65 105 C66 111 70 115 75 120" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 93 C129 85 138 94 135 105 C134 111 130 115 125 120" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- Jarrón mitad negra / mitad blanca -->
  <use href="#jarron" fill="#fff"/>
  <use href="#jarron" fill="#111" clip-path="url(#mitad-izq)"/>
  </g>
  <text x="100" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#111">LA PAZ</text>
</svg>
